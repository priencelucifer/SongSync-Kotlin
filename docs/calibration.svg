<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Echo calibration: after a 12 second lead-in each phone chirps four times in its own 2 second slot while the host's microphone records; the arrival of each chirp gives that phone's real delay">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17132B"/>
      <stop offset="1" stop-color="#0F0D16"/>
    </linearGradient>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>
    </pattern>
    <!-- one chirp: a short windowed burst -->
    <path id="chirp" d="M-9,0 L-7,-6 L-5,8 L-3,-14 L-1,18 L1,-20 L3,16 L5,-12 L7,7 L9,0" fill="none" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <g id="mic" fill="none" stroke="#C7B8FF" stroke-width="2.5" stroke-linecap="round">
      <rect x="-8" y="-20" width="16" height="26" rx="8"/>
      <path d="M-14,-2 a14,14 0 0 0 28,0"/>
      <line x1="0" y1="12" x2="0" y2="20"/>
    </g>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="60" y="52" font-size="24" font-weight="700" fill="#FFFFFF">Echo calibration</text>
    <text x="60" y="80" font-size="16" fill="#C9C3DC">Every phone plays the same chirp track in sync, but is only audible in its own slot. The host listens.</text>

    <!-- lead-in -->
    <rect x="60" y="130" width="190" height="80" rx="12" fill="url(#hatch)" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <text x="155" y="166" font-size="15" font-weight="600" fill="#E6DEFF" text-anchor="middle">lead-in 12 s</text>
    <text x="155" y="188" font-size="13" fill="#9C96B0" text-anchor="middle">phones settle into sync</text>
    <text x="262" y="176" font-size="22" fill="#9C96B0">⋯</text>

    <!-- slots: 300 px = 2 s; chirps at 250, 550, 1000, 1350 ms -->
    <g transform="translate(290,0)">
      <rect y="130" width="290" height="80" rx="12" fill="#5B3FD9" fill-opacity="0.35" stroke="#C7B8FF" stroke-opacity="0.6"/>
      <text x="12" y="122" font-size="15" font-weight="600" fill="#C7B8FF">Host</text>
      <g stroke="#C7B8FF" transform="translate(0,170)">
        <use xlink:href="#chirp" href="#chirp" x="37.5"/><use xlink:href="#chirp" href="#chirp" x="82.5"/>
        <use xlink:href="#chirp" href="#chirp" x="150"/><use xlink:href="#chirp" href="#chirp" x="202.5"/>
      </g>
    </g>
    <g transform="translate(590,0)">
      <rect y="130" width="290" height="80" rx="12" fill="#FFB0C8" fill-opacity="0.16" stroke="#FFB0C8" stroke-opacity="0.6"/>
      <text x="12" y="122" font-size="15" font-weight="600" fill="#FFB0C8">Phone 2</text>
      <g stroke="#FFB0C8" transform="translate(0,170)">
        <use xlink:href="#chirp" href="#chirp" x="37.5"/><use xlink:href="#chirp" href="#chirp" x="82.5"/>
        <use xlink:href="#chirp" href="#chirp" x="150"/><use xlink:href="#chirp" href="#chirp" x="202.5"/>
      </g>
    </g>
    <g transform="translate(890,0)">
      <rect y="130" width="250" height="80" rx="12" fill="#8FD3FF" fill-opacity="0.14" stroke="#8FD3FF" stroke-opacity="0.6"/>
      <text x="12" y="122" font-size="15" font-weight="600" fill="#8FD3FF">Phone 3 …</text>
      <g stroke="#8FD3FF" transform="translate(0,170)">
        <use xlink:href="#chirp" href="#chirp" x="37.5"/><use xlink:href="#chirp" href="#chirp" x="82.5"/>
        <use xlink:href="#chirp" href="#chirp" x="150"/><use xlink:href="#chirp" href="#chirp" x="202.5"/>
      </g>
    </g>
    <text x="1140" y="246" font-size="13" fill="#9C96B0" text-anchor="end">2 s per phone · uneven spacing can't be confused with a neighbour</text>

    <!-- pipeline -->
    <g transform="translate(0,290)">
      <use xlink:href="#mic" href="#mic" transform="translate(84,22)"/>
      <rect x="120" y="0" width="230" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="235" y="24" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Host microphone</text>
      <text x="235" y="44" font-size="13" fill="#9C96B0" text-anchor="middle">records the whole run</text>

      <text x="372" y="34" font-size="22" fill="#C7B8FF">→</text>
      <rect x="400" y="0" width="250" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="525" y="24" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Matched filter</text>
      <text x="525" y="44" font-size="13" fill="#9C96B0" text-anchor="middle">first arrival of every chirp</text>

      <text x="672" y="34" font-size="22" fill="#C7B8FF">→</text>
      <rect x="700" y="0" width="230" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="815" y="24" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Lateness per phone</text>
      <text x="815" y="44" font-size="13" fill="#9C96B0" text-anchor="middle">to a fraction of a ms</text>

      <text x="952" y="34" font-size="22" fill="#C7B8FF">→</text>
      <rect x="980" y="0" width="160" height="56" rx="14" fill="#7BE0A0" fill-opacity="0.16" stroke="#7BE0A0" stroke-opacity="0.6"/>
      <text x="1060" y="24" font-size="15" font-weight="600" fill="#7BE0A0" text-anchor="middle">Correction</text>
      <text x="1060" y="44" font-size="13" fill="#9C96B0" text-anchor="middle">if 2 runs agree ±4 ms</text>
    </g>
    <text x="60" y="394" font-size="13" fill="#9C96B0">Saved per phone and per speaker / headphones. The recording stays in memory and is never stored or sent.</text>
  </g>
</svg>
