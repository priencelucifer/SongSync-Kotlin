<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="SongSync: play the same song on every phone, perfectly in sync">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1533"/>
      <stop offset="1" stop-color="#0F0D16"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.12" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#5B3FD9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5B3FD9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.85" cy="0.7" r="0.45">
      <stop offset="0" stop-color="#FFB0C8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFB0C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C7B8FF"/>
      <stop offset="1" stop-color="#FFB0C8"/>
    </linearGradient>
    <path id="note" d="M12,3v10.55c-0.59,-0.34 -1.27,-0.55 -2,-0.55 -2.21,0 -4,1.79 -4,4s1.79,4 4,4 4,-1.79 4,-4V7h4V3h-6z"/>
    <g id="wave" fill="url(#bars)">
      <rect x="0" y="-5" width="4" height="10" rx="2"/>
      <rect x="8" y="-9" width="4" height="18" rx="2"/>
      <rect x="16" y="-14" width="4" height="28" rx="2"/>
      <rect x="24" y="-20" width="4" height="40" rx="2"/>
      <rect x="32" y="-13" width="4" height="26" rx="2"/>
      <rect x="40" y="-7" width="4" height="14" rx="2"/>
      <rect x="48" y="-11" width="4" height="22" rx="2"/>
      <rect x="56" y="-18" width="4" height="36" rx="2"/>
      <rect x="64" y="-24" width="4" height="48" rx="2"/>
      <rect x="72" y="-15" width="4" height="30" rx="2"/>
      <rect x="80" y="-8" width="4" height="16" rx="2"/>
      <rect x="88" y="-12" width="4" height="24" rx="2"/>
      <rect x="96" y="-19" width="4" height="38" rx="2"/>
      <rect x="104" y="-26" width="4" height="52" rx="2"/>
      <rect x="112" y="-17" width="4" height="34" rx="2"/>
      <rect x="120" y="-10" width="4" height="20" rx="2"/>
      <rect x="128" y="-6" width="4" height="12" rx="2"/>
      <rect x="136" y="-13" width="4" height="26" rx="2"/>
      <rect x="144" y="-22" width="4" height="44" rx="2"/>
      <rect x="152" y="-15" width="4" height="30" rx="2"/>
      <rect x="160" y="-9" width="4" height="18" rx="2"/>
      <rect x="168" y="-14" width="4" height="28" rx="2"/>
      <rect x="176" y="-20" width="4" height="40" rx="2"/>
      <rect x="184" y="-12" width="4" height="24" rx="2"/>
      <rect x="192" y="-7" width="4" height="14" rx="2"/>
      <rect x="200" y="-10" width="4" height="20" rx="2"/>
      <rect x="208" y="-16" width="4" height="32" rx="2"/>
      <rect x="216" y="-11" width="4" height="22" rx="2"/>
      <rect x="224" y="-6" width="4" height="12" rx="2"/>
      <rect x="232" y="-4" width="4" height="8" rx="2"/>
    </g>
    <g id="phone" fill="none" stroke="#C7B8FF" stroke-width="2.5">
      <rect x="0" y="-26" width="32" height="52" rx="7"/>
      <line x1="12" y1="20" x2="20" y2="20" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowL)"/>
  <rect width="1200" height="360" rx="28" fill="url(#glowR)"/>

  <!-- App icon -->
  <g transform="translate(80,110)">
    <rect width="140" height="140" rx="34" fill="#5B3FD9"/>
    <use xlink:href="#note" href="#note" transform="translate(14,32) scale(3.1)" fill="#FFFFFF" fill-opacity="0.7"/>
    <use xlink:href="#note" href="#note" transform="translate(52,14) scale(3.1)" fill="#FFFFFF"/>
  </g>

  <!-- Name and tagline -->
  <g font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="252" y="172" font-size="68" font-weight="700" fill="#FFFFFF" letter-spacing="-1">SongSync</text>
    <text x="254" y="216" font-size="22" fill="#C9C3DC">Play the same song on every phone, perfectly in sync.</text>
    <text x="254" y="262" font-size="18" fill="#C7B8FF" letter-spacing="0.5">JioSaavn · YouTube · Nearby Connections · Echo calibration</text>
  </g>

  <!-- Three phones, one waveform, lined up -->
  <g transform="translate(866,0)">
    <rect x="-24" y="66" width="330" height="230" rx="20" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <use xlink:href="#phone" href="#phone" transform="translate(-6,120)"/>
    <use xlink:href="#phone" href="#phone" transform="translate(-6,182)"/>
    <use xlink:href="#phone" href="#phone" transform="translate(-6,244)"/>
    <use xlink:href="#wave" href="#wave" transform="translate(44,120)"/>
    <use xlink:href="#wave" href="#wave" transform="translate(44,182)"/>
    <use xlink:href="#wave" href="#wave" transform="translate(44,244)"/>
    <line x1="150" y1="92" x2="150" y2="276" stroke="#7BE0A0" stroke-width="2" stroke-dasharray="5 5"/>
    <rect x="112" y="76" width="76" height="24" rx="12" fill="#7BE0A0"/>
    <text x="150" y="93" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="700" fill="#0F2A1B">in sync</text>
  </g>
</svg>
